customHeaders:
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(self), geolocation=(self), microphone=()
      - key: X-Frame-Options
        value: DENY
  - pattern: '**/*.@(js|css|png|jpg|jpeg|gif|svg|webp|woff|woff2)'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: 'index.html'
    headers:
      - key: Cache-Control
        value: no-cache
